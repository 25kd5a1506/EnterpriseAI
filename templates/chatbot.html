<!DOCTYPE html>
<html>

<head>

<title>EnterpriseAI Chatbot</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}


body{

    height:100vh;
    background:
    linear-gradient(135deg,#020617,#0f172a,#1e3a8a);

    color:white;

}


/* Header */

.header{

    height:80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

}


.logo{

    font-size:28px;
    font-weight:800;

}


.logo span{

    color:#00eaff;

}



.back{

    text-decoration:none;
    color:white;
    padding:10px 22px;
    border-radius:25px;

    background:#2563eb;

}



/* Main */

.main{

    display:flex;

    height:calc(100vh - 80px);

}

.sidebar{

    width:260px;

    background:#0f172a;

    border-right:1px solid rgba(255,255,255,0.1);

    padding:20px;

    overflow-y:auto;

}

#newChatBtn{

    width:100%;

    padding:12px;

    margin-bottom:20px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

#newChatBtn:hover{

    background:#1d4ed8;

}

#chatList{

    display:flex;

    flex-direction:column;

    gap:10px;

}

.chat-item{

    padding:12px;

    background:rgba(255,255,255,0.08);

    border-radius:10px;

    cursor:pointer;

    color:white;

    transition:0.3s;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.chat-item:hover{

    background:#2563eb;

}

/* AI Panel */

.ai-panel{

    width:25%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    rgba(255,255,255,0.05);

    border-right:1px solid rgba(255,255,255,0.15);

}



.robot{

    font-size:100px;

    animation:float 3s infinite;

}



@keyframes float{

50%{

transform:translateY(-15px);

}

}



.ai-panel h2{

    color:#00eaff;

    margin:20px;

}



.status{

    background:#16a34a;

    padding:8px 20px;

    border-radius:20px;

}



/* Chat Area */


.chat-area{

    width:calc(75% - 260px);


    display:flex;

    flex-direction:column;

}



.messages{

    flex:1;

    padding:30px;

    overflow-y:auto;

}



.message{

    max-width:70%;

    padding:15px 20px;

    border-radius:20px;

    margin-bottom:20px;

    line-height:1.5;

}



.user{

    margin-left:auto;

    background:#2563eb;

}



.ai{

    background:rgba(255,255,255,0.12);

    white-space:pre-wrap;

}



/* Input */


.input-box{

    display:flex;

    padding:20px;

    gap:15px;

}



input{

    flex:1;

    padding:15px;

    border-radius:30px;

    border:none;

    outline:none;

    font-size:16px;

}



button{

    width:120px;

    border:none;

    border-radius:30px;

    background:#00eaff;

    cursor:pointer;

    font-weight:bold;

}



button:hover{

    background:white;

}

.ai pre{

    position:relative;
    background:#020617;
    padding:20px;
    border-radius:12px;
    overflow:auto;

}


.code-copy-btn{

    position:absolute;

    top:10px;

    right:10px;

    background:rgba(255,255,255,0.12);

    color:white;

    border:1px solid rgba(255,255,255,0.2);

    padding:5px 10px;

    border-radius:8px;

    cursor:pointer;

    font-size:12px;

    backdrop-filter:blur(8px);

    transition:0.3s;

}


.code-copy-btn:hover{

    background:#2563eb;

}


.code-copy-btn:hover{

    background:#1d4ed8;

}

</style>
 
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
 

</head>


<body>


<div class="header">


<div class="logo">

🤖 Enterprise<span>AI</span>

</div>


<a class="back" href="/dashboard">

Dashboard

</a>


</div>


<div class="main">

<div class="sidebar">

    <button id="newChatBtn">+ New Chat</button>

    <div id="chatList"></div>

</div>

<div class="ai-panel">


<div class="robot">

🤖

</div>


<h2>

EnterpriseAI Assistant

</h2>


<div class="status">

Online

</div>


<p style="margin-top:20px;color:#ccc">

Powered by EnterpriseAI Engine
</p>


</div>


<div class="chat-area">


<div class="messages" id="messages">

    <div id="chatHistory"></div>

<div class="message ai">

👋 Hello {{ username }}!<br>

I am your EnterpriseAI assistant.<br>

How can I help you today?

</div>


</div>



<div class="input-box">


<input 
id="message"
placeholder="Ask something..."
onkeypress="checkEnter(event)">


<button onclick="sendMessage()">

Send 🚀

</button>

<button onclick="stopResponse()">
    Stop ⏹️
</button>

</div>


</div>


</div>





<script>


let stopTyping = false;

async function sendMessage(){

    stopTyping = false;

    const input = document.getElementById("message");
    const text = input.value.trim();

    if(text === "") return;

    const box = document.getElementById("messages");

    const userMsg = document.createElement("div");
    userMsg.className = "message user";
    userMsg.innerText = text;
    box.appendChild(userMsg);

    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.id = "loading";
    loading.innerText = "🤖 Thinking...";
    box.appendChild(loading);

    box.scrollTop = box.scrollHeight;

    try{

        const response = await fetch("/chat",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                message:text
            })
        });

        const data = await response.json();

        const res = await fetch("/chat-sessions");
const sessions = await res.json();

const list = document.getElementById("chatList");
list.innerHTML = "";

sessions.forEach(chat => {

    const item = document.createElement("div");

    item.className = "chat-item";

    item.innerText = "💬 " + chat.title;
    
    item.onclick = async function () {

    await fetch("/select-chat/" + chat.id);

    await loadChatHistory();

};

    list.appendChild(item);

});

        const loadingDiv = document.getElementById("loading");
        if(loadingDiv){
            loadingDiv.remove();
        }

        const aiMsg = document.createElement("div");
        aiMsg.className = "message ai";
        box.appendChild(aiMsg);

        const reply = "🤖 " + data.reply;

        let index = 0;
        let current = "";

        function typeWriter(){

            if(stopTyping) return;

            if(index < reply.length){

                current += reply.charAt(index);

                aiMsg.innerHTML = marked.parse(current);

                aiMsg.querySelectorAll("pre code").forEach((block)=>{
                    hljs.highlightElement(block);
                });

                index++;

                box.scrollTop = box.scrollHeight;

                setTimeout(typeWriter,20);

            }else{


                addCopyButtons();

                
            }

        }

        function addCopyButtons(){

            document.querySelectorAll(".ai pre").forEach((pre)=>{

                if(pre.querySelector(".code-copy-btn")) return;

                const btn = document.createElement("button");

                btn.className = "code-copy-btn";
                btn.innerText = "📋 Copy Code";

                btn.onclick = function(){

                    const code = pre.querySelector("code").innerText;

                    navigator.clipboard.writeText(code);

                    btn.innerText = "✅ Copied";

                    setTimeout(()=>{
                        btn.innerText = "📋 Copy Code";
                    },2000);

                };

                pre.insertBefore(btn,pre.firstChild);

            });

        }

        typeWriter();

            }
    catch(error){

        const loadingDiv = document.getElementById("loading");

        if(loadingDiv){
            loadingDiv.remove();
        }

        const box = document.getElementById("messages");

        const errorMsg = document.createElement("div");

        errorMsg.className = "message ai";
        errorMsg.innerText = "❌ AI connection error";

        box.appendChild(errorMsg);

    }

}

function checkEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

    }

}

function saveChat(){

    localStorage.setItem(
        "enterprise_chat",
        document.getElementById("messages").innerHTML
    );

}

function loadChat(){

    const history = localStorage.getItem("enterprise_chat");

    if(history){

        document.getElementById("messages").innerHTML = history;

    }

}

function stopResponse(){

    stopTyping = true;

}

async function loadChatHistory() {

    const response = await fetch("/chat-history?current=1");
    const chats = await response.json();

    const box = document.getElementById("messages");

    // Welcome message first
    box.innerHTML = `
        <div class="message ai">
            👋 Hello {{ username }}!<br>
            I am your EnterpriseAI assistant.<br>
            How can I help you today?
        </div>
    `;

    chats.reverse().forEach(chat => {

        box.innerHTML += `
            <div class="message user">
                ${chat.message}
            </div>

            <div class="message ai">
                ${marked.parse(chat.response)}
            </div>
        `;

    });

    box.scrollTop = box.scrollHeight;

}

window.onload = async function () {

    const list = document.getElementById("chatList");

const res = await fetch("/chat-sessions");
const sessions = await res.json();

list.innerHTML = "";

sessions.forEach(chat => {

    const item = document.createElement("div");

    item.className = "chat-item";

    item.innerText = "💬 " + chat.title;

    item.onclick = async function () {

        await fetch("/select-chat/" + chat.id);

        await loadChatHistory();

    };

    list.appendChild(item);

});

    await loadChatHistory();

    const btn = document.getElementById("newChatBtn");

btn.onclick = async function () {

    await fetch("/new-chat", {
        method: "POST"
    });

    document.getElementById("messages").innerHTML = `
        <div class="message ai">
            👋 Hello {{ username }}!<br>
            I am your EnterpriseAI assistant.<br>
            How can I help you today?
        </div>
    `;

    await loadChatHistory();

};

};

</script>


</body>
</html>
