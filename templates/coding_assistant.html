<!DOCTYPE html>
<html>

<head>

<title>EnterpriseAI Coding Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

height:100vh;
background:#020617;
color:white;
overflow:hidden;

}


/* Header */

.header{

height:70px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 30px;

background:#111827;

border-bottom:1px solid #334155;

}


.logo{

font-size:28px;
font-weight:800;

}


.logo span{

color:#3b82f6;

}


.dashboard{

color:white;
text-decoration:none;

background:#2563eb;

padding:10px 20px;

border-radius:20px;

}




/* IDE */

.ide{

display:flex;

height:calc(100vh - 70px);

}



/* Explorer */

.explorer{

width:230px;

background:#111827;

padding:20px;

border-right:1px solid #334155;

}


.explorer h3{

color:#60a5fa;

margin-bottom:20px;

}


.file{

padding:12px;

border-radius:8px;

margin-bottom:10px;

cursor:pointer;

color:#cbd5e1;

}


.file:hover,
.file.active{

background:#2563eb;

color:white;

}





/* Main */

.main{

flex:1;

display:flex;

flex-direction:column;

}



/* Toolbar */

.toolbar{

padding:15px;

background:#1e293b;

display:flex;

gap:15px;

}



select,input{

padding:10px;

border-radius:8px;

border:none;

outline:none;

}



input{

flex:1;

}




button{

padding:11px 22px;

border:none;

border-radius:8px;

background:#3b82f6;

color:white;

cursor:pointer;

font-weight:bold;

}



button:hover{

background:#2563eb;

}




/* Editor */

.editor{

height:50%;

padding:20px;

background:#020617;

}



textarea{

width:100%;

height:220px;

background:#020617;

color:#22c55e;

border:1px solid #334155;

padding:20px;

font-family:Consolas;

font-size:16px;

border-radius:10px;

resize:none;

}




/* Output */

.output{

flex:1;

padding:20px;

background:#0f172a;

overflow:auto;

}



.ai-box{

background:#1e293b;

padding:20px;

border-radius:12px;

white-space:pre-line;

min-height:150px;

}




.copy{

background:#16a34a;

margin-top:15px;

}



</style>


</head>



<body>



<div class="header">


<div class="logo">

💻 Enterprise<span>AI</span> Code Studio

</div>


<a class="dashboard" href="/dashboard">

Dashboard

</a>


</div>







<div class="ide">





<div class="explorer">


<h3>

Explorer

</h3>



<div class="file active" onclick="selectFile(this,'Python')">

🐍 Python.py

</div>



<div class="file" onclick="selectFile(this,'Java')">

☕ Java.java

</div>



<div class="file" onclick="selectFile(this,'C')">

⚙️ C_program.c

</div>



<div class="file" onclick="selectFile(this,'SQL')">

🗄️ SQL.sql

</div>



<div class="file" onclick="selectFile(this,'JavaScript')">

🌐 app.js

</div>



</div>









<div class="main">





<div class="toolbar">


<select id="language">


<option>Python</option>

<option>Java</option>

<option>C</option>

<option>SQL</option>

<option>JavaScript</option>


</select>



<input id="request"

placeholder="Describe your coding problem...">


<button onclick="generateCode()">

🚀 Generate

</button>


</div>







<div class="editor">


<h3>

📝 Code Editor

</h3>

<br>


<textarea id="code">

// AI generated code appears here

</textarea>


</div>







<div class="output">


<h3>

🤖 AI Explanation

</h3>


<br>


<div class="ai-box" id="result">

AI response appears here...

</div>



<button class="copy" onclick="copyCode()">

📋 Copy Code

</button>


</div>





</div>



</div>







<script>



function selectFile(element,lang){


document.getElementById("language").value=lang;



document.querySelectorAll(".file")
.forEach(file=>{

file.classList.remove("active");

});



element.classList.add("active");



document.getElementById("request").placeholder =

"Enter "+lang+" coding problem...";



}







async function generateCode(){



let result=document.getElementById("result");

let code=document.getElementById("code");



result.innerHTML="⏳ AI is generating code...";



let response=await fetch("/generate-code",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({


language:
document.getElementById("language").value,


request:
document.getElementById("request").value


})


});



let data=await response.json();



code.value=data.code;


result.innerHTML=

"✅ Code generated successfully";


}






function copyCode(){


navigator.clipboard.writeText(

document.getElementById("code").value

);


alert("Code copied!");

}



</script>



</body>

</html>
