<!DOCTYPE html>
<html>

<head>

<title>EnterpriseAI Translator</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

min-height:100vh;

background:#020617;

color:white;

overflow-x:hidden;

}


/* Header */

.header{

height:75px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 40px;

background:#111827;

border-bottom:1px solid #334155;

}


.logo{

font-size:30px;

font-weight:800;

}


.logo span{

color:#3b82f6;

}


.dashboard{

color:white;

text-decoration:none;

background:#2563eb;

padding:10px 25px;

border-radius:25px;

}



/* Hero */

.hero{

text-align:center;

padding:35px;

}


.hero h1{

font-size:42px;

color:#60a5fa;

}



.hero p{

color:#cbd5e1;

}



/* Globe Animation */


.globe{

font-size:80px;

text-align:center;

animation:rotate 5s linear infinite;

}



@keyframes rotate{

0%{

transform:rotateY(0deg);

}

100%{

transform:rotateY(360deg);

}

}




/* Main */

.translator{

display:grid;

grid-template-columns:1fr 160px 1fr;

gap:30px;

padding:30px 70px;

align-items:center;

}




.card{

background:rgba(255,255,255,0.08);

border:1px solid #334155;

border-radius:25px;

padding:25px;

backdrop-filter:blur(15px);

transition:.4s;

}



.card:hover{

transform:translateY(-10px);

}



.card h2{

color:#60a5fa;

margin-bottom:20px;

}



select,textarea{

width:100%;

background:#020617;

color:white;

border:1px solid #334155;

border-radius:12px;

padding:15px;

}



textarea{

height:220px;

margin-top:20px;

resize:none;

}




/* AI Flow */

.flow{

text-align:center;

}



.robot{

font-size:60px;

animation:pulse 1.5s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.2);

}

}



.arrow{

font-size:50px;

color:#3b82f6;

animation:move 1s infinite alternate;

}



@keyframes move{

from{

transform:translateX(-10px);

}

to{

transform:translateX(10px);

}

}



.loading{

margin-top:15px;

}



.dot{

display:inline-block;

animation:blink 1.5s infinite;

}


.dot:nth-child(2){

animation-delay:.3s;

}


.dot:nth-child(3){

animation-delay:.6s;

}


@keyframes blink{

50%{

opacity:.2;

}

}




.translate{

display:block;

margin:20px auto;

padding:15px 45px;

border:none;

border-radius:30px;

background:#2563eb;

color:white;

font-weight:bold;

cursor:pointer;

font-size:16px;

}



.translate:hover{

background:#3b82f6;

}



.copy{

display:block;

margin:auto;

padding:12px 30px;

border:none;

border-radius:25px;

background:#16a34a;

color:white;

cursor:pointer;

}




@media(max-width:900px){

.translator{

grid-template-columns:1fr;

}

}

</style>

</head>



<body>



<div class="header">


<div class="logo">

🌍 Enterprise<span>AI</span>

</div>


<a href="/dashboard" class="dashboard">

Dashboard

</a>


</div>






<div class="hero">


<div class="globe">

🌐

</div>


<h1>

AI Translator Engine

</h1>


<p>

Real-time multilingual translation powered by AI

</p>


</div>








<div class="translator">





<div class="card">


<h2>

🇬🇧 Source Language

</h2>



<select id="from">

<option>English</option>

<option>Telugu</option>

<option>Hindi</option>

<option>Spanish</option>

</select>




<textarea id="input"

placeholder="Type your message..."></textarea>



</div>







<div class="flow">


<div class="arrow">

➜

</div>


<div class="robot">

🤖

</div>


<div class="loading">

AI Processing

<span class="dot">.</span>

<span class="dot">.</span>

<span class="dot">.</span>

</div>


<div class="arrow">

➜

</div>


</div>







<div class="card">


<h2>

🇮🇳 Target Language

</h2>




<select id="to">

<option>Telugu</option>

<option>English</option>

<option>Hindi</option>

<option>Spanish</option>

</select>




<textarea id="output"

placeholder="AI translation..."

readonly></textarea>


</div>





</div>







<button class="translate" onclick="translateText()">

✨ Translate With AI

</button>



<button class="copy" onclick="copyText()">

📋 Copy Translation

</button>







<script>


async function translateText(){


let output=document.getElementById("output");


output.value="🤖 AI Processing...";



let response=await fetch("/translate",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

text:
document.getElementById("input").value,


from:
document.getElementById("from").value,


to:
document.getElementById("to").value

})

});



let data=await response.json();


output.value=data.translation;


}





function copyText(){


navigator.clipboard.writeText(

document.getElementById("output").value

);


alert("Copied!");

}


</script>



</body>

</html>
