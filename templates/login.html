<!DOCTYPE html>
<html>

<head>

<title>EnterpriseAI Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#020617;

color:white;

}



/* Main Card */

.login-card{

width:380px;

background:#111827;

border:1px solid #334155;

border-radius:20px;

padding:35px;

box-shadow:0 20px 40px rgba(0,0,0,0.4);

}



.ai-icon{

text-align:center;

font-size:45px;

margin-bottom:15px;

}




.logo{

text-align:center;

font-size:32px;

font-weight:800;

margin-bottom:10px;

}


.logo span{

color:#3b82f6;

}



.subtitle{

text-align:center;

color:#94a3b8;

margin-bottom:25px;

}



/* Error Message */

.error-box{

background:#450a0a;

border:1px solid #ef4444;

color:#fca5a5;

padding:12px;

border-radius:12px;

text-align:center;

margin-bottom:20px;

font-size:14px;

}



/* Inputs */


label{

display:block;

margin-bottom:8px;

color:#cbd5e1;

}



input{

width:100%;

padding:14px;

margin-bottom:20px;

border-radius:12px;

border:1px solid #334155;

background:#020617;

color:white;

font-size:15px;

}



input:focus{

outline:none;

border-color:#3b82f6;

}



/* Button */


button{

width:100%;

padding:14px;

border:none;

border-radius:25px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#3b82f6;

}



/* Register */


.register{

text-align:center;

margin-top:20px;

color:#94a3b8;

}



.register a{

color:#60a5fa;

text-decoration:none;

}


</style>


</head>


<body>



<div class="login-card">


<div class="ai-icon">

🤖

</div>



<div class="logo">

Enterprise<span>AI</span>

</div>



<div class="subtitle">

Login to your AI Workspace

</div>




{% if error %}

<div class="error-box">

⚠️ {{ error }}

</div>

{% endif %}





<form method="POST">



<label>

Username

</label>


<input type="text" 
name="username" 
placeholder="Enter username">





<label>

Password

</label>


<input type="password" 
name="password" 
placeholder="Enter password">





<button type="submit">

🔐 Login

</button>



</form>






<div class="register">

Don't have an account?

<a href="/register">

Register

</a>


</div>



</div>



</body>

</html>
