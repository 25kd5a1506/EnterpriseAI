<!DOCTYPE html>
<html>

<head>

<title>EnterpriseAI Analytics Studio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
background:#020617;
color:white;
}


/* Header */

.header{

height:65px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
background:#111827;
border-bottom:1px solid #334155;

}


.logo{

font-size:25px;
font-weight:800;

}

.logo span{

color:#3b82f6;

}


.dashboard{

color:white;
text-decoration:none;
background:#2563eb;
padding:8px 18px;
border-radius:20px;

}



/* Title */

.hero{

text-align:center;
padding:20px;

}


.hero h1{

font-size:32px;
color:#60a5fa;

}



/* Flow */

.flow{

display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin:10px;

}


.box{

width:100px;
padding:10px;
background:#111827;
border:1px solid #334155;
border-radius:12px;
text-align:center;
font-size:13px;

}


.icon{

font-size:25px;

}


.arrow{

font-size:22px;
color:#3b82f6;

}



/* Main */

.main{

display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px 45px;

}



.card{

background:#111827;
border:1px solid #334155;
border-radius:18px;
padding:20px;

}



.card h2{

color:#60a5fa;
font-size:20px;
margin-bottom:15px;

}



textarea{

width:100%;
height:150px;
background:#020617;
color:white;
border:1px solid #334155;
border-radius:12px;
padding:15px;

}



button{

margin-top:10px;
padding:10px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:20px;
cursor:pointer;

}



/* Report */

.result{

background:#020617;
padding:15px;
border-radius:12px;
height:150px;
overflow:auto;
white-space:pre-line;

}



/* Table */

.table-box{

margin:10px 45px;
background:#111827;
padding:20px;
border-radius:18px;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#2563eb;
padding:10px;

}


td{

padding:10px;
text-align:center;
border-bottom:1px solid #334155;

}





/* Cards */

.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px 45px;

}



.small-card{

background:#111827;
padding:18px;
border-radius:15px;
border:1px solid #334155;
text-align:center;

}


.value{

font-size:24px;
color:#60a5fa;
font-weight:bold;

}





/* Chart */

.chart-box{

margin:10px 45px;
padding:20px;
background:#111827;
border-radius:18px;

}


.chart{

height:170px;
display:flex;
align-items:end;
justify-content:center;
gap:25px;

}



.bar{

width:35px;
background:#2563eb;
border-radius:5px 5px 0 0;

}



.python{

height:50px;

}

.java{

height:50px;

}


.dbms{

height:50px;

}


.ai{

height:50px;

}



.labels{

display:flex;
justify-content:center;
gap:20px;
margin-top:10px;

}


.labels span{

width:45px;
text-align:center;
font-size:12px;

}



</style>

</head>


<body>



<div class="header">

<div class="logo">

📊 Enterprise<span>AI</span>

</div>


<a class="dashboard" href="/dashboard">

Dashboard

</a>


</div>





<div class="hero">

<h1>
AI Data Analysis Studio
</h1>

<p>
Convert raw data into intelligent insights
</p>

</div>






<div class="flow">


<div class="box">

<div class="icon">📂</div>
Data

</div>


<div class="arrow">➜</div>


<div class="box">

<div class="icon">🤖</div>
AI

</div>


<div class="arrow">➜</div>


<div class="box">

<div class="icon">📈</div>
Report

</div>


</div>







<div class="main">


<div class="card">

<h2>
📥 Enter Data
</h2>

<input type="file" id="csvFile" accept=".csv" onchange="loadCSV()">

<textarea id="data"
placeholder="Paste CSV data here..."></textarea>


<button onclick="analyzeData()">

✨ Analyze

</button>


</div>





<div class="card">

<h2>

🤖 AI Report

</h2>


<div class="result" id="result">

Waiting...

</div>


</div>



</div>








<div class="table-box">


<h2>

📋 Table Preview

</h2>


<br>


<table id="table"></table>


</div>








<div class="cards">


<div class="small-card">

Total Students

<div class="value" id="total">0</div>

</div>


<div class="small-card">

Average

<div class="value" id="avg">0%</div>

</div>



<div class="small-card">

Top Performer

<div class="value" id="top">-</div>

</div>




<div class="small-card">

Best Subject

<div class="value" id="best">-</div>

</div>


</div>







<div class="chart-box">


<h2>📊 Subject Chart</h2>


<br>


<div class="chart">


<div class="bar python"></div>

<div class="bar java"></div>

<div class="bar dbms"></div>

<div class="bar ai"></div>


</div>


<div class="labels">

<span>Python</span>
<span>Java</span>
<span>DBMS</span>
<span>AI</span>

</div>


</div>








<script>



function createTable(){


let rows=document.getElementById("data").value.trim().split("\n");


let table=document.getElementById("table");


table.innerHTML="";


rows.forEach((row,index)=>{


let tr=document.createElement("tr");


row.split(",").forEach(cell=>{


let td=document.createElement(index==0?"th":"td");


td.innerHTML=cell;


tr.appendChild(td);


});


table.appendChild(tr);


});


}

function loadCSV(){

let file = document.getElementById("csvFile").files[0];

if(!file){
return;
}

let reader = new FileReader();

reader.onload = function(e){

document.getElementById("data").value = e.target.result;

};

reader.readAsText(file);

}



async function analyzeData(){


createTable();


let rows=document.getElementById("data").value.trim().split("\n");


let students=rows.slice(1);



let totals=[0,0,0,0];

let highest=0;

let topper="-";



students.forEach(row=>{


let data=row.split(",");


let name=data[0];


let marks=data.slice(1).map(Number);



let avg=

marks.reduce((a,b)=>a+b,0)/4;



if(avg>highest){

highest=avg;

topper=name;

}



marks.forEach((m,i)=>{

totals[i]+=m;

});


});





document.getElementById("total").innerHTML=

students.length;



let average=

(totals.reduce((a,b)=>a+b,0)/(students.length*4)).toFixed(1);



document.getElementById("avg").innerHTML=

average+"%";



document.getElementById("top").innerHTML=

topper;



let subjects=["Python","Java","DBMS","AI"];


let index=

totals.indexOf(Math.max(...totals));


document.getElementById("best").innerHTML=

subjects[index];





document.querySelector(".python").style.height=

(totals[0]/students.length)+"px";


document.querySelector(".java").style.height=

(totals[1]/students.length)+"px";


document.querySelector(".dbms").style.height=

(totals[2]/students.length)+"px";


document.querySelector(".ai").style.height=

(totals[3]/students.length)+"px";





let response=await fetch("/analyze-data",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

data:document.getElementById("data").value

})

});



let result=await response.json();



document.getElementById("result").innerHTML=

result.analysis;



}



</script>


</body>

</html>
